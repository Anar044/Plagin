name: Optional Socket HMAC Build
on:
  push:
    branches:
      - feature/optional-hmac-socket-auth-20261019
  pull_request:
    paths:
      - 'Resto.Front.Api.HorecaControlPlugin/**'
      - '.github/workflows/optional-socket-hmac-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build existing net472 plugin without packaging or deployment
        shell: pwsh
        run: dotnet build API.HorecaControl.sln -p:APIVersion=V8P5 --configuration Release
